model:
  input_dim: 3
  output_dim: 3

  fabric:
    layers: 3
    channels: [32, 64, 128]
    height: 64
    width: 64

  dynamics:
    dt: 0.1
    diffusion_coeff: 0.1
    advection_coeff: 0.05
    damping: 0.01
    fractional_alpha: 0.8

  memory:
    trace_dim: 128
    max_traces: 512
    retrieval_temp: 0.07
    salience_threshold: 0.5