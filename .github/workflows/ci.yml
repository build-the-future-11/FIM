name: CI

on:
  push:
    branches: [main, "2424/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile
        run: |
          python -m compileall -q fim fim_experiments scripts tests
      - name: Test
        env:
          MPLBACKEND: Agg
        run: |
          pytest -q
